# SRS 4 直播服务配置：RTMP 接收 + HLS 分发 + 推流鉴权回调
# 推流地址：rtmp://localhost:1935/live/{streamKey}
# HLS 地址：http://localhost:8082/live/{streamKey}.m3u8（后端 /api/live/rooms/{id}/hls 会代理并隐藏密钥）
# 启动：在 deploy/srs 目录执行 ./start-srs.sh
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
# 运行态文件目录，SRS 需要可写的 objs 目录存放 pid
pid                 ./media/srs.pid;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    # 与后端 LIVE_HLS_BASE_URL 默认值一致
    listen          8082;
    dir             ./media;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        # 推流鉴权：后端校验 stream key，返回 0 才允许推流
        # SRS 与后端都在宿主机上运行，直接用 127.0.0.1；若 SRS 跑在容器里请改为 host.docker.internal
        on_publish      http://127.0.0.1:7071/api/live/hooks/publish;
        on_unpublish    http://127.0.0.1:7071/api/live/hooks/unpublish;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      30;
        hls_path        ./media;
        # 生成 live/{streamKey}.m3u8 与 live/{streamKey}-{seq}.ts
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
