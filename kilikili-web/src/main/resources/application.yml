server:
  port: 7071
spring:
  application:
    name: kilikili-web
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/kilikili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:jobclaw}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: always
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0

kilikili:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:kilikili}
  ai:
    enabled: ${AI_REVIEW_ENABLED:true}
    batch-size: ${AI_REVIEW_BATCH_SIZE:5}
    poll-interval-ms: ${AI_REVIEW_POLL_INTERVAL_MS:20000}
    initial-delay-ms: ${AI_REVIEW_INITIAL_DELAY_MS:10000}
    auto-publish: ${AI_REVIEW_AUTO_PUBLISH:false}
    # 多模态视觉模型（OpenAI 兼容接口），用于分析视频关键帧；默认复用 DeepSeek 的 Key 与地址
    vision:
      enabled: ${AI_VISION_ENABLED:true}
      chat-url: ${AI_VISION_CHAT_URL:${spring.ai.openai.base-url:https://api.deepseek.com}/chat/completions}
      api-key: ${AI_VISION_API_KEY:${spring.ai.openai.api-key:}}
      model: ${AI_VISION_MODEL:deepseek-chat}
      timeout-seconds: ${AI_VISION_TIMEOUT_SECONDS:30}
    # 弹幕发送时的 DeepSeek 语义审核开关（本地敏感词库始终生效）
    danmaku-moderation-enabled: ${AI_DANMAKU_MODERATION_ENABLED:true}
  progress:
    enabled: ${PLAY_PROGRESS_ENABLED:true}
    delay-ms: ${PLAY_PROGRESS_DELAY_MS:20000}
    flush-interval-ms: ${PLAY_PROGRESS_FLUSH_INTERVAL_MS:20000}
    initial-delay-ms: ${PLAY_PROGRESS_INITIAL_DELAY_MS:5000}
    cache-ttl-seconds: ${PLAY_PROGRESS_CACHE_TTL_SECONDS:86400}
    batch-size: ${PLAY_PROGRESS_BATCH_SIZE:200}
  search:
    enabled: ${SEARCH_ES_ENABLED:true}
    index: ${SEARCH_INDEX:kilikili_video}
    sync-interval-ms: ${SEARCH_SYNC_INTERVAL_MS:120000}
    initial-delay-ms: ${SEARCH_SYNC_INITIAL_DELAY_MS:8000}
  # 推荐页缓存治理：穿透空值缓存 / 击穿分布式锁 / 雪崩 TTL 抖动 + 本地 L1 / 延迟双删 / 热点 key 探测
  cache:
    recommend-ttl-seconds: ${CACHE_RECOMMEND_TTL_SECONDS:300}
    ttl-jitter-seconds: ${CACHE_TTL_JITTER_SECONDS:60}
    null-ttl-seconds: ${CACHE_NULL_TTL_SECONDS:60}
    local-ttl-ms: ${CACHE_LOCAL_TTL_MS:30000}
    lock-ttl-ms: ${CACHE_LOCK_TTL_MS:3000}
    lock-wait-ms: ${CACHE_LOCK_WAIT_MS:60}
    double-delete-delay-ms: ${CACHE_DOUBLE_DELETE_DELAY_MS:500}
    category-cache-seconds: ${CACHE_CATEGORY_TTL_SECONDS:300}
    hot-key-window-ms: ${CACHE_HOT_KEY_WINDOW_MS:10000}
    hot-key-threshold: ${CACHE_HOT_KEY_THRESHOLD:50}
    hot-key-extra-ttl-seconds: ${CACHE_HOT_KEY_EXTRA_TTL_SECONDS:300}
    hot-key-max-size: ${CACHE_HOT_KEY_MAX_SIZE:200}
    hot-key-flush-interval-ms: ${CACHE_HOT_KEY_FLUSH_INTERVAL_MS:10000}
  live:
    # 主播推流地址前缀，最终地址为 {rtmp-base-url}/{streamKey}
    rtmp-base-url: ${LIVE_RTMP_BASE_URL:rtmp://localhost:1935/live}
    # 后端反代 SRS 的 HLS 地址（deploy/srs/srs.conf 中 http_server 监听 8082）
    hls-base-url: ${LIVE_HLS_BASE_URL:http://127.0.0.1:8082}
    # SRS 的 HLS 输出目录，后端读盘代理；相对路径基于后端启动目录 kilikili-web
    hls-dir: ${LIVE_HLS_DIR:../deploy/srs/media}
  transcode:
    enabled: ${TRANSCODE_ENABLED:true}
    executor: ${TRANSCODE_EXECUTOR:docker}
    docker-image: ${TRANSCODE_DOCKER_IMAGE:mwader/static-ffmpeg}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    work-dir: ${TRANSCODE_WORK_DIR:/tmp/kilikili-transcode}
    poll-interval-ms: ${TRANSCODE_POLL_INTERVAL_MS:10000}
    max-attempts: ${TRANSCODE_MAX_ATTEMPTS:3}
    max-concurrency: ${TRANSCODE_MAX_CONCURRENCY:2}
    # HLS 切片时长（秒），强制关键帧对齐保证切片可独立解码
    segment-seconds: ${TRANSCODE_SEGMENT_SECONDS:6}
    # 失败重试指数退避：首次 5s，之后翻倍，上限 60s
    retry-backoff-ms: ${TRANSCODE_RETRY_BACKOFF_MS:5000}
    retry-backoff-max-ms: ${TRANSCODE_RETRY_BACKOFF_MAX_MS:60000}
    video-preset: ${TRANSCODE_VIDEO_PRESET:veryfast}
    renditions:
      - name: 480p
        height: 480
        video-bitrate: 1400k
        audio-bitrate: 96k
      - name: 720p
        height: 720
        video-bitrate: 2800k
        audio-bitrate: 128k
      - name: 1080p
        height: 1080
        video-bitrate: 5000k
        audio-bitrate: 192k

  mq:
    # 未启动 broker 时可置为 false，流水线退化为进程内同步执行
    enabled: ${MQ_ENABLED:true}
    namesrv-addr: ${MQ_NAMESRV_ADDR:127.0.0.1:9876}
    producer-group: ${MQ_PRODUCER_GROUP:kilikili-video-producer}
    consumer-group: ${MQ_CONSUMER_GROUP:kilikili-video-pipeline-consumer}
    topic: ${MQ_TOPIC:kilikili-video-pipeline}
    max-reconsume-times: ${MQ_MAX_RECONSUME_TIMES:3}
    send-timeout-ms: ${MQ_SEND_TIMEOUT_MS:3000}
    consume-thread-min: ${MQ_CONSUME_THREAD_MIN:2}
    consume-thread-max: ${MQ_CONSUME_THREAD_MAX:6}
    # 补偿扫描：阶段停留超过 reconcile-delay-seconds 未完成则重投
    reconcile-interval-ms: ${MQ_RECONCILE_INTERVAL_MS:60000}
    reconcile-delay-seconds: ${MQ_RECONCILE_DELAY_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info